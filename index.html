<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>不稳定的2048</title>

  <!-- PWA：离线安装到手机主屏幕 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#8a7a66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="不稳定2048">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="stat"><span class="label">分数</span><span id="score">0</span></div>
      <div class="stat"><span class="label">最大</span><span id="max-tile">2</span></div>
      <div class="stat"><span class="label">最高分</span><span id="best">0</span></div>

      <!-- 挂机倍速：仅挂机模式显示 -->
      <div
        id="idle-speed-control"
        class="idle-speed-control hidden"
        role="group"
        aria-label="挂机倍速"
      >
        <div class="idle-speed-options">
          <button type="button" data-idle-speed="1" aria-pressed="false">1x</button>
          <button type="button" data-idle-speed="2" aria-pressed="false">2x</button>
          <button type="button" data-idle-speed="3" aria-pressed="false">3x</button>
          <button type="button" data-idle-speed="5" aria-pressed="false">5x</button>
          <button type="button" data-idle-speed="10" aria-pressed="false">10x</button>
        </div>
      </div>

      <button id="btn-pause" aria-label="暂停">Ⅱ</button>
    </div>

    <!-- 主菜单 -->
    <div id="menu" class="overlay">
      <h1>俄罗斯方块<span class="big">X2048</span></h1>
      <p class="subtitle">接住方块，让相同数字合在一起</p>

      <!-- V14/V14.2 局前设置 -->
      <div class="settings">
        <label class="setting-row" for="classic-growth-toggle">
          <span>经典模式：大数字变大</span>
          <input id="classic-growth-toggle" type="checkbox" role="switch" aria-label="经典模式：大数字变大">
        </label>
        <label class="setting-row" for="idle-growth-toggle">
          <span>挂机模式：大数字变大</span>
          <input id="idle-growth-toggle" type="checkbox" role="switch" aria-label="挂机模式：大数字变大">
        </label>
        <label class="setting-row" for="merge-cap-select">
          <span>合成上限</span>
          <select id="merge-cap-select">
            <option value="4096">4096</option>
            <option value="8192">8192</option>
            <option value="16384">16384</option>
            <option value="32768">32768</option>
            <option value="65536">65536</option>
            <option value="131072">131072</option>
            <option value="262144">262144</option>
            <option value="infinite">无限</option>
          </select>
        </label>
        <p class="settings-hint">这些设置会在下一局开始时生效</p>
      </div>

      <div class="buttons">
        <button id="btn-classic" class="primary">开始经典模式</button>
        <button id="btn-idle">开始挂机模式</button>
        <button id="btn-history">查看历史战绩</button>
      </div>

      <div class="help">
        <p>点击方块：旋转</p>
        <p>左右拖动：移动</p>
        <p>按住向下：加速下落</p>
        <p>相同数字碰撞：合并</p>
        <p>方块堆到红线：本局结束</p>
        <p class="best-line">最高分：<span id="menu-best">0</span></p>
        <p class="offline-status" id="offline-status">离线缓存：检测中…</p>
      </div>
    </div>

    <!-- 暂停 -->
    <div id="pause-overlay" class="overlay hidden">
      <div class="panel">
        <h2>已暂停</h2>
        <div class="buttons">
          <button id="btn-resume" class="primary">继续游戏</button>
          <button id="btn-quit-pause">返回主菜单</button>
        </div>
      </div>
    </div>

    <!-- 结算 -->
    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h2>游戏结束</h2>
        <div class="result">
          <div class="stat"><span class="label">本局分数</span><span id="over-score">0</span></div>
          <div class="stat"><span class="label">最大数字</span><span id="over-max-tile">2</span></div>
          <div class="stat"><span class="label">最高分</span><span id="over-best">0</span></div>
        </div>
        <div class="buttons">
          <button id="btn-restart" class="primary">再来一局</button>
          <button id="btn-to-menu">回主菜单</button>
        </div>
      </div>
    </div>

    <!-- V14.2 历史战绩 -->
    <div id="history-overlay" class="overlay hidden">
      <div class="panel history-panel">
        <h2>历史战绩</h2>
        <div class="history-tabs">
          <button id="hist-tab-classic" class="active">经典模式</button>
          <button id="hist-tab-idle">挂机模式</button>
        </div>
        <div id="history-list" class="history-list"></div>
        <div class="buttons">
          <button id="btn-history-clear">清空当前记录</button>
          <button id="btn-history-close" class="primary">返 回</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/matter.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/core/EventBus.js"></script>
  <script src="./js/entities/Cell.js"></script>
  <script src="./js/entities/RigidBody.js"></script>
  <script src="./js/entities/Piece.js"></script>
  <script src="./js/systems/PhysicsWorld.js"></script>
  <script src="./js/systems/SpawnSystem.js"></script>
  <script src="./js/systems/MergeSystem.js"></script>
  <script src="./js/systems/LoseSystem.js"></script>
  <script src="./js/systems/ScoreSystem.js"></script>
  <script src="./js/systems/HistorySystem.js"></script>
  <script src="./js/systems/IdleAI.js"></script>
  <script src="./js/core/Game.js"></script>
  <script src="./js/systems/InputSystem.js"></script>
  <script src="./js/render/Renderer.js"></script>
  <script src="./js/ui/ui.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
